<nav class="navbar navbar-expand-lg navbar-light bg-light">
  <div class="container-fluid">
    <!-- Restaurant Name on the left -->
    <a class="navbar-brand" href="/">{{ title }}</a>

    <!-- Toggle button for small screens -->
    <button
      class="navbar-toggler"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#navbarNav"
      aria-controls="navbarNav"
      aria-expanded="false"
      aria-label="Toggle navigation"
    >
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="container mt-3 pe-3 me-3">
      <div class="input-group mb-3">
        <input
          type="text"
          [(ngModel)]="searchTerm"
          placeholder="Search"
          class="form-control custom-search-input"
          id="searchInput"
          (keydown.enter)="searchItemsOrVendors()"
        />
      </div>
    </div>

    <!-- Expanded Search Bar (Appears when Search Icon is Clicked) -->
    <div *ngIf="isSearchExpanded" class="mobile-search d-md-none">
      <input
        type="text"
        [(ngModel)]="searchTerm"
        placeholder="Enter restaurant name or item name"
        class="form-control custom-search-input"
        id="searchInput"
        (keydown.enter)="searchItemsOrVendors()"
      />
    </div>

    <!-- Vendor list, shown only when no item search is active and no vendor is selected -->
    <div class="row" *ngIf="isVendorSearch && !selectedVendor">
      <div class="col-md-12" *ngFor="let vendor of vendors">
        <div
          class="card mb-4 shadow-sm d-flex flex-row align-items-center p-3"
          (click)="selectVendor(vendor)"
        ></div>
      </div>
    </div>

    <!-- Register and Login links on the right -->
    <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
      <ul class="navbar-nav">
        <li class="nav-item">
          <a class="nav-link" href="/">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="/"> Restaurants </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="/login"> Login </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="/cart"> Cart </a>
        </li>
      </ul>
    </div>
  </div>
</nav>
